<!-- Skrip Mesin AI Gemini (Versi Aman) -->
    <script>
        const btnGenerate = document.getElementById('btn-generate');
        const outputCanvas = document.getElementById('output-canvas');
        const inputTopik = document.getElementById('input-topik');
        const inputWaktu = document.getElementById('input-waktu');
        const inputMetode = document.getElementById('input-metode');

        btnGenerate.addEventListener('click', async () => {
            const topik = inputTopik.value;
            const waktu = inputWaktu.value;
            const metode = inputMetode.value;

            if(!topik || !waktu) {
                alert("Harap isi Topik Pembelajaran dan Alokasi Waktu terlebih dahulu!");
                return;
            }

            // Meminta API Key secara aman melalui pop-up lokal (tidak tersimpan di server)
            const API_KEY = prompt("Untuk keamanan, masukkan Kunci API Gemini Anda di sini:");
            
            if (!API_KEY) {
                alert("Pembuatan modul dibatalkan karena Kunci API kosong.");
                return;
            }

            outputCanvas.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-blue-600"><i class="fas fa-spinner fa-spin text-4xl mb-4"></i><p class="text-sm font-bold">AI sedang menyusun dan memformat Modul Ajar...</p></div>';

            const promptText = `Anda adalah Asisten Pendidik Ahli pembuat Modul Ajar Kurikulum Merdeka. Buat dokumen modul ajar lengkap. Topik: ${topik}. Waktu: ${waktu}. Metodologi: ${metode}. Format hasil mutlak HANYA menggunakan tag HTML dasar (<h1>, <h2>, <p>, <ul>, <table>) agar rapi saat dicetak. JANGAN gunakan markdown (\`\`\`). Pastikan memuat: 1) Kop Identitas (SD-SMP SATAP N15 Poleang Barat), 2) Capaian & Tujuan, 3) 8 Dimensi Profil Lulusan & 7 Kebiasaan Anak Hebat, 4) Skenario Kegiatan (Pendahuluan, Inti, Penutup), 5) Asesmen (Formatif/Sumatif), dan 6) Blok Pengesahan di paling bawah (Mengetahui Kepala Sekolah Lukman, S.Pd. & Guru Mapel Faisal A., S.Pd.,Gr.).`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });
                
                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text;
                
                let cleanHTML = resultText.replace(/```html/g, '').replace(/```/g, '');
                outputCanvas.innerHTML = cleanHTML;
                
            } catch (error) {
                outputCanvas.innerHTML = `<div class="p-6 text-red-600 font-bold border-2 border-red-300 rounded bg-red-50"><i class="fas fa-exclamation-triangle mr-2"></i>Terjadi kesalahan sistem: Pastikan API Key valid atau cek koneksi internet. Detail: ${error.message}</div>`;
            }
        });
    </script>
