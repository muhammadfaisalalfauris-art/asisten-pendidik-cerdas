<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Modul Ajar AI - Asisten Pendidik Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex overflow-hidden">

    <!-- Sidebar Navigasi -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col h-full shadow-sm z-10 shrink-0">
        <div class="p-5 border-b border-slate-200 bg-blue-50">
            <h2 class="font-bold text-lg text-blue-800">Asisten Pendidik</h2>
            <p class="text-xs text-blue-600 mt-1">SD-SMP SATAP N15 Poleang Barat</p>
        </div>
        <div class="overflow-y-auto p-4 flex-1">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Menu Perangkat</p>
            <div class="space-y-1.5">
                <a href="index.html" class="block w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 text-slate-600 font-medium transition text-sm"><i class="fas fa-database mr-2 w-5"></i> Master Data</a>
                <button class="w-full text-left px-3 py-2 rounded-md bg-blue-600 text-white font-medium shadow-sm text-sm"><i class="fas fa-chalkboard-teacher mr-2 w-5"></i> Generator Modul Ajar</button>
            </div>
        </div>
    </aside>

    <!-- Area Konten Utama -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm shrink-0">
            <div>
                <h1 class="font-bold text-xl text-slate-800">Ruang Kendali AI: Modul Ajar (8-3-3-4)</h1>
            </div>
        </header>

        <div class="p-6 overflow-y-auto flex-1 bg-slate-50">
            <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 max-w-7xl mx-auto h-full">
                
                <!-- Panel Input Parameter AI -->
                <div class="xl:col-span-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                    <h2 class="font-bold text-md text-slate-700 border-b border-slate-100 pb-2 mb-4"><i class="fas fa-robot text-blue-500 mr-2"></i>Parameter Instruksi</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Topik Spesifik Pembelajaran</label>
                            <textarea id="input-topik" rows="3" placeholder="Misal: Sistem Tata Surya..." class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-blue-500 outline-none resize-none"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Target Kelas</label>
                                <input type="text" value="Fase D - Kelas 7" class="w-full border border-slate-300 rounded p-2 text-sm bg-slate-50" readonly>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Alokasi Waktu</label>
                                <input id="input-waktu" type="text" placeholder="Misal: 2 JP" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-2">Metodologi Utama</label>
                            <select id="input-metode" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-blue-500 outline-none">
                                <option>Deep Learning (Mindful, Meaningful, Joyful)</option>
                                <option>Project Based Learning (PjBL)</option>
                                <option>Discovery Learning</option>
                            </select>
                        </div>
                        <button id="btn-generate" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg text-sm font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-magic"></i> Generate Modul Cerdas
                        </button>
                    </div>
                </div>

                <!-- Panel Pratinjau Output PDF -->
                <div class="xl:col-span-8 bg-slate-200 p-2 rounded-xl shadow-inner border border-slate-300 flex flex-col relative min-h-[600px]">
                    <div id="output-canvas" class="bg-white flex-1 rounded-lg shadow-sm p-8 overflow-y-auto text-slate-700 border border-slate-300 prose max-w-none">
                        <div class="text-slate-400 flex flex-col items-center justify-center h-full border-2 border-dashed border-slate-200 rounded-lg p-6">
                            <i class="fas fa-file-alt text-4xl mb-3"></i>
                            <p class="text-sm font-bold text-slate-500">Kanvas Output Dokumen</p>
                            <p class="text-xs text-center mt-2">Hasil rancangan Modul Ajar beserta Lembar Pengesahan akan otomatis dirender di area ini menggunakan format HTML siap cetak.</p>
                        </div>
                    </div>
                    <div class="absolute bottom-6 right-6 flex gap-3">
                        <button onclick="window.print()" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-lg transition-colors flex items-center gap-2">
                            <i class="fas fa-print"></i> Cetak Dokumen
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const btnGenerate = document.getElementById('btn-generate');
        const outputCanvas = document.getElementById('output-canvas');
        const inputTopik = document.getElementById('input-topik');
        const inputWaktu = document.getElementById('input-waktu');
        const inputMetode = document.getElementById('input-metode');

        btnGenerate.addEventListener('click', () => {
            const topik = inputTopik.value || "Pembelajaran Umum";
            const waktu = inputWaktu.value || "2 JP";
            const metode = inputMetode.value;

            outputCanvas.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-blue-600"><i class="fas fa-spinner fa-spin text-4xl mb-4"></i><p class="text-sm font-bold">Menyusun Format Dokumen Modul Ajar...</p></div>';

            setTimeout(() => {
                const htmlTemplate = `
                    <div style="font-family: 'Times New Roman', Times, serif; line-height: 1.6; color: #000; padding: 10px;">
                        
                        <!-- KOP SURAT -->
                        <div style="text-align: center; border-bottom: 4px solid #000; padding-bottom: 8px; margin-bottom: 25px;">
                            <h3 style="margin: 0; font-size: 14px; font-weight: bold; letter-spacing: 1px;">PEMERINTAH KABUPATEN BOMBANA</h3>
                            <h3 style="margin: 2px 0; font-size: 14px; font-weight: bold; letter-spacing: 1px;">DINAS PENDIDIKAN DAN KEBUDAYAAN</h3>
                            <h2 style="margin: 4px 0; font-size: 18px; font-weight: bold;">SD-SMP SATAP N15 POLEANG BARAT</h2>
                            <p style="margin: 2px 0; font-size: 12px; font-style: italic;">Desa Babamolingku, Kecamatan Poleang Barat, Kabupaten Bombana</p>
                        </div>

                        <!-- JUDUL DOKUMEN -->
                        <div style="text-align: center; margin-bottom: 25px;">
                            <h2 style="margin: 0; font-size: 16px; font-weight: bold; text-decoration: underline;">MODUL AJAR KURIKULUM MERDEKA</h2>
                            <p style="margin: 4px 0 0 0; font-size: 13px; font-weight: bold;">MATA PELAJARAN: ILMU PENGETAHUAN ALAM (IPA)</p>
                        </div>
                        
                        <!-- TABEL INFORMASI UMUM -->
                        <table style="width: 100%; font-size: 13px; margin-bottom: 20px; border-collapse: collapse;">
                            <tr>
                                <td style="width: 28%; font-weight: bold; padding: 5px; border: 1px solid #999; background: #f2f2f2;">Penyusun</td>
                                <td style="width: 72%; padding: 5px; border: 1px solid #999;">Faisal A., S.Pd., Gr.</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; padding: 5px; border: 1px solid #999; background: #f2f2f2;">Satuan Pendidikan</td>
                                <td style="padding: 5px; border: 1px solid #999;">SD-SMP SATAP N15 Poleang Barat</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; padding: 5px; border: 1px solid #999; background: #f2f2f2;">Topik / Materi Pokok</td>
                                <td style="padding: 5px; border: 1px solid #999; font-weight: bold; color: #000;">${topik}</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; padding: 5px; border: 1px solid #999; background: #f2f2f2;">Fase / Kelas</td>
                                <td style="padding: 5px; border: 1px solid #999;">Fase D - Kelas 7 / Semester Ganjil</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; padding: 5px; border: 1px solid #999; background: #f2f2f2;">Alokasi Waktu</td>
                                <td style="padding: 5px; border: 1px solid #999;">${waktu} (Pertemuan Tatap Muka)</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; padding: 5px; border: 1px solid #999; background: #f2f2f2;">Pendekatan / Metodologi</td>
                                <td style="padding: 5px; border: 1px solid #999;">${metode}</td>
                            </tr>
                        </table>

                        <!-- KOMPONEN A -->
                        <h4 style="font-size: 14px; font-weight: bold; background: #e6e6e6; padding: 6px; margin: 15px 0 8px 0; border-left: 4px solid #000;">A. TUJUAN PEMBELAJARAN</h4>
                        <ul style="font-size: 13px; padding-left: 20px; margin-top: 5px;">
                            <li>Peserta didik mampu memahami konsep dasar, mengidentifikasi karakteristik, serta menganalisis fenomena yang berkaitan dengan <b>${topik}</b> secara cermat.</li>
                            <li>Peserta didik mampu menyajikan hasil penelaahan atau observasi sederhana melalui kerja sama kelompok yang solid.</li>
                        </ul>

                        <!-- KOMPONEN B -->
                        <h4 style="font-size: 14px; font-weight: bold; background: #e6e6e6; padding: 6px; margin: 15px 0 8px 0; border-left: 4px solid #000;">B. PROFIL PELAJAR PANCASILA & 7 KEBIASAAN ANAK HEBAT</h4>
                        <ul style="font-size: 13px; padding-left: 20px; margin-top: 5px;">
                            <li><b>Dimensi Profil:</b> Beriman, bertakwa kepada Tuhan YME, berakhlak mulia, bernalar kritis, mandiri, dan bergotong royong.</li>
                            <li><b>7 Kebiasaan Anak Hebat:</b> Disiplin waktu, aktif bertanya, kolaboratif, bertanggung jawab pada tugas, serta peduli lingkungan.</li>
                        </ul>

                        <!-- KOMPONEN C -->
                        <h4 style="font-size: 14px; font-weight: bold; background: #e6e6e6; padding: 6px; margin: 15px 0 8px 0; border-left: 4px solid #000;">C. SKENARIO KEGIATAN PEMBELAJARAN</h4>
                        <table style="width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px;" border="1">
                            <thead>
                                <tr style="background: #f2f2f2; text-align: center;">
                                    <th style="padding: 6px; width: 18%;">Tahapan</th>
                                    <th style="padding: 6px; width: 67%;">Rincian Kegiatan Pembelajaran (${metode})</th>
                                    <th style="padding: 6px; width: 15%;">Waktu</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="padding: 6px; font-weight: bold; text-align: center;">Pendahuluan</td>
                                    <td style="padding: 6px;">
                                        1. Guru memberi salam, memeriksa kehadiran, dan memimpin doa.<br>
                                        2. Apersepsi kesiapan emosional & mental siswa (Mindful learning) terkait topik ${topik}.<br>
                                        3. Menyampaikan garis besar tujuan pembelajaran.
                                    </td>
                                    <td style="padding: 6px; text-align: center;">15 Menit</td>
                                </tr>
                                <tr>
                                    <td style="padding: 6px; font-weight: bold; text-align: center;">Kegiatan Inti</td>
                                    <td style="padding: 6px;">
                                        1. Siswa mengamati konsep dasar materi ${topik} (Meaningful exploration).<br>
                                        2. Diskusi kelompok terarah guna menyelesaikan lembar kerja bermakna.<br>
                                        3. Presentasi hasil kerja kelompok dan penguatan konsep oleh guru (Joyful engagement).
                                    </td>
                                    <td style="padding: 6px; text-align: center;">60 Menit</td>
                                </tr>
                                <tr>
                                    <td style="padding: 6px; font-weight: bold; text-align: center;">Penutup</td>
                                    <td style="padding: 6px;">
                                        1. Bersama siswa melakukan refleksi pencapaian belajar hari ini.<br>
                                        2. Menyimpulkan inti materi ${topik} secara bersama-sama.<br>
                                        3. Menutup kegiatan dengan doa dan salam.
                                    </td>
                                    <td style="padding: 6px; text-align: center;">15 Menit</td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- KOMPONEN D -->
                        <h4 style="font-size: 14px; font-weight: bold; background: #e6e6e6; padding: 6px; margin: 15px 0 8px 0; border-left: 4px solid #000;">D. ASESMEN PEMBELAJARAN</h4>
                        <table style="width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 5px;" border="1">
                            <tr>
                                <td style="width: 25%; font-weight: bold; padding: 5px; background: #f9f9f9;">Asesmen Formatif</td>
                                <td style="width: 75%; padding: 5px;">Penilaian proses melalui keaktifan berdiskusi, sikap kolaboratif, dan pengamatan kerja kelompok.</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; padding: 5px; background: #f9f9f9;">Asesmen Sumatif</td>
                                <td style="padding: 5px;">Evaluasi tertulis mandiri di akhir sesi untuk mengukur tingkat pemahaman penguasaan materi ${topik}.</td>
                            </tr>
                        </table>

                        <!-- LEMBAR PENGESAHAN -->
                        <div style="margin-top: 35px; display: flex; justify-content: space-between; font-size: 13px; page-break-inside: avoid;">
                            <div style="width: 45%; text-align: center;">
                                <p style="margin: 0;">Mengetahui,</p>
                                <p style="margin: 0;">Kepala SD-SMP SATAP N15 Poleang Barat</p>
                                <br><br><br><br>
                                <p style="margin: 0;"><b><u>Lukman, S.Pd.</u></b></p>
                                <p style="margin: 0;">NIP. 19700101XXXXXXXXXX</p>
                            </div>
                            <div style="width: 45%; text-align: center;">
                                <p style="margin: 0;">Babamolingku, ${new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}</p>
                                <p style="margin: 0;">Guru Mata Pelajaran IPA</p>
                                <br><br><br><br>
                                <p style="margin: 0;"><b><u>Faisal A., S.Pd., Gr.</u></b></p>
                                <p style="margin: 0;">NIP. 19910517XXXXXXXXXX</p>
                            </div>
                        </div>

                    </div>
                `;
                outputCanvas.innerHTML = htmlTemplate;
            }, 600);
        });
    </script>
</body>
</html>
